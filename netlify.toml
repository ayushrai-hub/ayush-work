[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  directory = "api"

# Versioned project routes land on the existing projects function.
# These rules are ahead of the /api/* splat so they match first.
[[redirects]]
  from = "/api/v1/projects/:slug"
  to = "/.netlify/functions/projects?slug=:slug"
  status = 200

[[redirects]]
  from = "/api/v1/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v1/compare"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v1/search"
  to = "/.netlify/functions/search"
  status = 200

# MCP Server Card (SEP-2127): <streamable-http-url>/server-card.
[[redirects]]
  from = "/api/mcp/server-card"
  to = "/.netlify/functions/mcp?resource=server-card"
  status = 200

# API before the SPA fallback. Existing static files are not forced aside.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Content negotiation for agents that send Accept: text/markdown.
# Direct *.md URLs do not need these rules; Netlify serves those files as-is.
# force is set so a prerendered HTML file can yield to its Markdown twin.
[[redirects]]
  from = "/"
  to = "/index.md"
  status = 200
  force = true
  conditions = {Accept = ["text/markdown"]}

[[redirects]]
  from = "/work/*"
  to = "/work/:splat.md"
  status = 200
  force = true
  conditions = {Accept = ["text/markdown"]}

