[build]
  command = "npm run build"
  publish = "dist"

[functions]
  node_bundler = "esbuild"
  directory = "api"

# Vercel Web Analytics. www is served by Netlify, so the script and its view/event/session
# endpoints are proxied to the Vercel project's own alias, which ingests them for ayush-work.
[[redirects]]
  from = "/_vercel/insights/*"
  to = "https://ayush-rai-work.vercel.app/_vercel/insights/:splat"
  status = 200

# Versioned project routes land on the existing projects function.
# These rules are ahead of the /api/* splat so they match first.
[[redirects]]
  from = "/api/v1/projects/:slug"
  to = "/.netlify/functions/projects?slug=:slug"
  status = 200

[[redirects]]
  from = "/api/v1/projects"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v1/compare"
  to = "/.netlify/functions/projects"
  status = 200

[[redirects]]
  from = "/api/v1/search"
  to = "/.netlify/functions/search"
  status = 200

# MCP Server Card (SEP-2127): <streamable-http-url>/server-card.
[[redirects]]
  from = "/api/mcp/server-card"
  to = "/.netlify/functions/mcp?resource=server-card"
  status = 200

# NLWeb-shaped lexical ask (not under /api so scanners find POST /ask).
[[redirects]]
  from = "/ask"
  to = "/.netlify/functions/ask"
  status = 200

# Lowercase alias for the root AGENTS.md agent guide.
[[redirects]]
  from = "/agents.md"
  to = "/AGENTS.md"
  status = 200

# API before the SPA fallback. Existing static files are not forced aside.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200

# Accept: text/markdown negotiation runs in the markdown-negotiation edge function below.
# Netlify redirect conditions cannot match on Accept, so it is not done with redirects here.

# Unknown paths must not reuse the homepage. Prerendered files still win
# because force is off. design-system and product logs are real files.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[edge_functions]]
  function = "markdown-negotiation"
  path = "/*"

[[headers]]
  for = "/**/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Vary = "Accept"

[[headers]]
  for = "/.well-known/api-catalog"
  [headers.values]
    Content-Type = 'application/linkset+json; profile="https://www.rfc-editor.org/info/rfc9727"'
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/ai-catalog.json"
  [headers.values]
    Content-Type = "application/ai-catalog+json"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/.well-known/ard.json"
  [headers.values]
    Content-Type = "application/json"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/mcp/server-card.json"
  [headers.values]
    Content-Type = "application/mcp-server-card+json"
    Cache-Control = "public, max-age=3600"
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET"
    Access-Control-Allow-Headers = "Content-Type, If-None-Match"
    Access-Control-Expose-Headers = "ETag"

[[headers]]
  for = "/auth.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/feeds/*"
  [headers.values]
    Content-Type = "application/jsonl; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/pricing.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/agent-mode.json"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=300"

[[headers]]
  for = "/"
  [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </.well-known/ard.json>; rel="ard", </.well-known/ai-catalog.json>; rel="ai-catalog", </sitemap.xml>; rel="sitemap", </llms.txt>; rel="describedby"'

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Vary = "Accept"

[build.environment]
  NODE_VERSION = "22"
