# SPA fallback for client routes. force stays off so prerendered HTML,
# Markdown twins, llms.txt, the sitemap, and other real files win.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/**/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Vary = "Accept"

[[headers]]
  for = "/index.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    X-Content-Type-Options = "nosniff"
    Vary = "Accept"

[build.environment]
  NODE_VERSION = "18"
