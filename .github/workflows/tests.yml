# Quality checks for every push to main and every pull request into main.
#
# One job runs the same commands a contributor runs locally, in order:
#   lint (ESLint) -> typecheck (tsc -b) -> unit tests with coverage (Vitest)
#   -> production build (client, SSR, prerender) -> browser tests (Playwright, Chromium).
# Node 22 matches netlify.toml and satisfies Vite 7 (Node 20.19+ or 22.12+).
# Coverage and the Playwright report are uploaded as artifacts; there is no coverage gate
# because legacy, unrouted components are still counted in the totals.
name: Tests and Quality Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
