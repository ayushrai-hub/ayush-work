  <div id="root"></div>
  <!-- document.modelContext.registerTool is in this document, with navigator.modelContext only as a fallback. -->
  <script>
    (function () {
      function registerPortfolioTool() {
        if (window.__ayushWebMcpRegistered) return;
        var tool = {
          name: "search_portfolio_projects",
          description: "Lexical search of Ayush Rai's public portfolio. Same records as GET /api/v1/search.",
          inputSchema: {
            type: "object",
            properties: { query: { type: "string", description: "Search text" } },
            required: ["query"],
            additionalProperties: false,
          },
          annotations: { readOnlyHint: true },
          execute: function (args) {
            var q = args && typeof args.query === "string" ? args.query : "";
            return fetch("/api/v1/search?q=" + encodeURIComponent(q), {
              headers: { Accept: "application/json" },
            }).then(function (res) { return res.json(); });
          },
        };
        if (document.modelContext && typeof document.modelContext.registerTool === "function") {
          window.__ayushWebMcpRegistered = true;
          document.modelContext.registerTool(tool);
        } else if (typeof navigator !== "undefined" && navigator.modelContext && typeof navigator.modelContext.registerTool === "function") {
          window.__ayushWebMcpRegistered = true;
          navigator.modelContext.registerTool(tool);
        }
      }
      document.addEventListener("DOMContentLoaded", registerPortfolioTool);
    })();
  </script>
  <script src="/webmcp.js" defer></script>
